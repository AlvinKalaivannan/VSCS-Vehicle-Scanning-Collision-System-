# 2D masks -> 3D component labels. Phase 2.
schema_version: 1

# =============================================================================
# APPROVED by the developer on 2026-09-24 (task P2-T1). 13 components, against a
# requirement of >= 8.
#
# Reviewed at approval time: the list originally split the REAR bumper into
# corners but contained nothing for rear protrusions. On many vans a tow bar is
# the actual first-contact point when reversing - low, rigid, and well behind the
# bumper. The developer confirmed this van has NO tow bar, rear step, spare wheel
# carrier or ladder: the rear end is plain, so the rear bumper and its two corners
# genuinely are the rearmost points. Nothing was added.
#
# Front corners are deliberately NOT split while rear corners are. That asymmetry
# is intentional: this is a reversing/low-speed manoeuvring system, so rear
# geometry carries the resolution. Revisit if forward manoeuvring becomes a focus.
#
# Changing this list after P2-T3 has run invalidates the per-component IoU
# measurements, so treat it as frozen for the phase.
#
# AMENDED by the developer on 2026-09-29: `rear_doors` split into `rear_door_left` and
# `rear_door_right` (now 14 components). Each rear door swings on its own hinge
# (model.yaml joints), and a URDF joint moves exactly one link, so one component could
# not carry two hinges. Made before P2-T3 has run on real data, so nothing is invalidated.
# =============================================================================
vocabulary_status: "APPROVED_2026-09-24_AMENDED_2026-09-29"

# Stage-wide seed for every random process in seg/ (e.g. sampling the 20 frames for the
# P2-T2 visual check). Fusion and cleanup are deterministic and do not use it.
seed: 20260924

components:
  # machine_name: text prompt fed to the open-vocabulary detector
  # Left/right follow the veh frame (+y = left, §4.1), NOT the image: seen from the front,
  # the van's left parts appear on the image's right. So a detector's left/right text is
  # a hint only; the side is settled in 3D by the sign of y.
  front_bumper: "front bumper of a van"
  rear_bumper: "rear bumper of a van"
  rear_left_bumper_corner: "left corner of the rear bumper"
  rear_right_bumper_corner: "right corner of the rear bumper"
  left_mirror: "left side mirror"
  right_mirror: "right side mirror"
  sliding_door_right: "sliding side door of a van"
  rear_door_left: "left rear cargo door of a van"
  rear_door_right: "right rear cargo door of a van"
  wheel_front_left: "front left wheel and tyre"
  wheel_front_right: "front right wheel and tyre"
  wheel_rear_left: "rear left wheel and tyre"
  wheel_rear_right: "rear right wheel and tyre"
  underbody: "underside of a van"

detector:
  engine: "grounding_dino"
  box_threshold: 0.30
  text_threshold: 0.25

segmenter:
  engine: "sam2"
  # Propagate masks through the scan video instead of prompting every frame.
  track_across_frames: true
  keyframe_stride: 15

fusion3d:
  # Project each 3D point into every posed frame, reject occluded observations,
  # then vote. P2-T3 acceptance: mean per-component IoU >= 0.70.
  occlusion_depth_tolerance_m: 0.03
  min_observations_per_point: 3
  min_vote_fraction: 0.50
  target_mean_iou: 0.70

cleanup:
  # P2-T5: must not make IoU worse. Deterministic (no random process, so no seed).
  # Two same-label points closer than this belong to the same cluster.
  cluster_eps_m: 0.05
  # A cluster smaller than this is a stray label - unless it is that component's largest
  # cluster, so a small, sparsely seen part (a mirror) is never deleted outright.
  remove_clusters_smaller_than: 50
  # A stray point takes the majority label of kept points within this radius, if at
  # least this many are there; otherwise it becomes "none". Unlabelled points are never
  # given a label (cleanup removes errors; it does not guess new coverage).
  reassign_radius_m: 0.10
  reassign_min_neighbours: 5
