# Convex decomposition, joints, URDF export. Phase 2 (P2-T6..T8).
schema_version: 1

decompose:
  engine: "coacd"           # coacd | vhacd | obb  (fallback ladder, §8.2)
  threshold: 0.05           # CoACD concavity threshold
  max_convex_hulls: 16
  preprocess_resolution: 50
  seed: 20260924
  # P2-T6 acceptance: hull volume within +/- 15% of the point-cloud-derived volume.
  max_volume_error_fraction: 0.15

urdf:
  robot_name: "vscs_van"
  # The root link sits at the veh frame origin (ground, below rear axle centre).
  base_link: "base_link"
  mesh_format: "obj"
  mesh_dir: "meshes"

# Collision-geometry variants (ADR 0004).
#
# The sliding door runs on a CURVED track: it pops outward, travels rearward, then
# settles back in. A prismatic joint along x would be wrong by roughly the track's
# outward throw through the whole middle of its travel - on a component with severity
# 2.5. So the door is not a joint at all. It is two separately scanned, separately
# decomposed collision models, selected per run from the state the operator wrote down
# (R-15).
#
# Consequence for the offline pipeline: P2-T6 and P2-T8 run once per variant.
variants:
  status: "AWAITING_P1_T2_SCAN"
  sliding_door_right:
    closed: null      # path to the closed-door collision model, set at P2-T8
    open: null        # path to the open-door collision model, set at P2-T8
    # Measure on capture day and record here: body skin to door skin at full open,
    # which is the number that justifies ADR 0004.
    measured_outward_throw_m: null

joints:
  # Genuine hinges only. Axes are set manually in v0.1 (R-15); auto-detection from
  # open/closed scans is a stretch goal. Values below are structural placeholders -
  # measured on the real van at P2-T7 and committed with the scan they came from.
  # The sliding door is deliberately absent: see `variants` above and ADR 0004.
  status: "PLACEHOLDER_MEASURE_AT_P2_T7"
  rear_door_left:
    type: "revolute"
    axis: [0.0, 0.0, 1.0]
    limit_lower: 0.0
    limit_upper: 2.44     # ~140 deg
  rear_door_right:
    type: "revolute"
    axis: [0.0, 0.0, 1.0]
    limit_lower: -2.44
    limit_upper: 0.0
  left_mirror:
    type: "revolute"
    axis: [0.0, 0.0, 1.0]
    limit_lower: -1.57
    limit_upper: 0.0
  right_mirror:
    type: "revolute"
    axis: [0.0, 0.0, 1.0]
    limit_lower: 0.0
    limit_upper: 1.57
