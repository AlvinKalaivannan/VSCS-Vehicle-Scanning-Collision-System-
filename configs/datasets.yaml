# External (third-party) datasets: what each may be used for. ADR 0006.
#
# Developer's decision 2026-09-29: use existing licensed datasets first; fill the gaps
# with our own footage or by asking dataset owners for a licence.
#
# What a dataset may be used for is NOT set by hand. It is derived from
# `license_status` and `license` by the `policy` block below, in
# src/vscs/common/datasets.py, so a permissive-sounding entry cannot quietly grant
# publication rights. Code that touches external data calls `require_use(id, use)`.
#
# External data lives in data/external/<id>/ (gitignored, like all of data/). It never
# enters the dev/test lot splits (R-09) or the P4-T9 gold sets, which are ours.
schema_version: 1

# --- Uses ----------------------------------------------------------------------
#   rehearsal        run pipeline stages on it privately, to shake out bugs
#   private_eval     compute numbers on it for our own understanding
#   publish_results  report numbers on it (README, writeup), with a citation
#   train            train the student segmenter on it (the weights may be published)
#   publish_media    show its images/video/renders in docs/evidence, the README or the demo
policy:
  permissive_licenses: [CC-BY-4.0, CC0-1.0, Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause]
  noncommercial_licenses: [CC-BY-NC-4.0, CC-BY-NC-SA-4.0]
  uses_by_class:
    permissive: [rehearsal, private_eval, publish_results, train, publish_media]
    noncommercial: [rehearsal, private_eval, publish_results]
    conflicting: [rehearsal, private_eval]   # §9 third-party rule: private testing only
    unverified: []                           # verify before any use (§0: unclear licence)
    none: []                                 # no licence = no permission
  # A licence can only be granted by whoever owns the photos. When a dataset does not say
  # where its images came from (typical of user uploads), its images are never shown
  # publicly, whatever licence the uploader attached.
  undocumented_provenance_removes: [publish_media]

# --- Registry -------------------------------------------------------------------
# license_status: clear | conflicting | unverified | none
# provenance: documented | undocumented  (where the underlying images came from)
# adopted: whether we actually download it. A clear licence is not a reason to
# download data that does not cover a gap.
datasets:
  uco3d:
    name: "UnCommon Objects in 3D (Meta, CVPR 2025)"
    url: "https://github.com/facebookresearch/uco3d"
    license: CC-BY-4.0
    license_url: "https://github.com/facebookresearch/uco3d"
    license_status: clear
    verified: 2026-09-29
    adopted: false
    covers: [sfm_rehearsal_consumer_video]
    notes: >-
      Licence clean and consistent. Not adopted: crowd-sourced, mostly handheld/tabletop
      objects; no evidence of full-size vehicles; the personal_vehicles category is only
      reachable in blind ~16 GB video archives (289 GB total), and the category list sits
      in a 13 GB metadata database. Revisit if a vehicle subset is published.

  roboflow_car_parts_21:
    name: "Roboflow Universe 'car parts' (21 classes, 998 source images)"
    url: "https://universe.roboflow.com/car-segmentation-iq9jj/car-parts-9vig8"
    license: CC-BY-4.0
    license_url: "https://universe.roboflow.com/car-segmentation-iq9jj/car-parts-9vig8"
    license_status: clear
    provenance: undocumented
    verified: 2026-09-29
    adopted: true
    covers: [part_vocabulary, segmenter_cross_vehicle_test]
    source: {workspace: car-segmentation-iq9jj, project: car-parts-9vig8, version: 2}
    notes: >-
      Roboflow API reports "CC BY 4.0", public, 998 source images, instance segmentation,
      21 classes (Back-bumper .. Windshield). Mirror is ONE class (no left/right). Version 2
      holds 2,594 images: the train split is augmented copies (saturation, brightness),
      valid (100) and test (100) are not - evaluate on valid/test only. The uploader does
      not say where the photos came from, so images are never shown publicly.

  roboflow_car_parts_19:
    name: "Roboflow Universe 'Car Parts Segmentation' (19 classes, 603 source images)"
    url: "https://universe.roboflow.com/person-detector/car-parts-segmentation"
    license: CC-BY-4.0
    license_url: "https://universe.roboflow.com/person-detector/car-parts-segmentation"
    license_status: conflicting
    provenance: undocumented
    verified: 2026-09-29
    adopted: true
    covers: [part_vocabulary, segmenter_cross_vehicle_test]
    source: {workspace: person-detector, project: car-parts-segmentation, version: 2}
    notes: >-
      Roboflow API reports "CC BY 4.0", but the 19 classes are exactly the DSMLR
      Car-Parts-Segmentation classes plus "car", and DSMLR states no licence (see
      dsmlr_car_parts). An uploader cannot license photos they do not own, so the CC BY
      claim is treated as conflicting: private rehearsal/evaluation only. Useful because
      it keeps left/right mirrors and doors apart (CLAUDE.md §8.2 flip rule). Version 2's
      train split is heavily augmented (rotate, mosaic, noise, cutout); use valid (75)
      and test (78) for evaluation.

  threedrealcar:
    name: "3DRealCar (ICCV 2025): 2,500 smartphone 360-degree car scans"
    url: "https://github.com/LiAutoAD/3DRealCar"
    license: Apache-2.0
    license_url: "https://github.com/xiaobiaodu/3DRealCar_Toolkit"
    license_status: conflicting
    verified: 2026-09-29
    adopted: false
    covers: [vehicle_360_scan, metric_scale_reference, part_labels_2d, vans]
    notes: >-
      Repos carry an Apache-2.0 LICENSE and the toolkit README says the dataset is free
      for commercial use, but the download page says "Copyright Li Auto Inc. All Rights
      Reserved". The best-fitting dataset found; pending the developer's decision to ask
      the authors. Until resolved: private rehearsal/evaluation only.

  tanks_and_temples:
    name: "Tanks and Temples ('Truck' scene)"
    url: "https://www.tanksandtemples.org/download/"
    license: CC-BY-4.0
    license_url: "https://www.tanksandtemples.org/license/"
    license_status: conflicting
    verified: 2026-09-29
    adopted: false
    covers: [vehicle_360_scan]
    notes: >-
      Licence page states CC BY 4.0 and also a non-commercial research licence that
      forbids redistribution without permission.

  co3d:
    name: "Common Objects in 3D v2 (Meta)"
    url: "https://github.com/facebookresearch/co3d"
    license: CC-BY-NC-4.0
    license_url: "https://github.com/facebookresearch/co3d"
    license_status: clear
    verified: 2026-09-29
    adopted: false
    covers: [sfm_rehearsal_consumer_video]
    notes: "Non-commercial. Superseded for our purposes by uCO3D, which has the same gap."

  mvimgnet:
    name: "MVImgNet / MVImgNet2.0"
    url: "https://github.com/GAP-LAB-CUHK-SZ/MVImgNet"
    license: CC-BY-NC-4.0
    license_url: "https://github.com/GAP-LAB-CUHK-SZ/MVImgNet"
    license_status: clear
    verified: 2026-09-29
    adopted: false
    covers: [sfm_rehearsal_consumer_video]
    notes: "Non-commercial, plus its own terms of use. Handheld objects."

  dsmlr_car_parts:
    name: "DSMLR Car-Parts-Segmentation (500 images, 18 classes)"
    url: "https://github.com/dsmlr/Car-Parts-Segmentation"
    license: null
    license_url: null
    license_status: none
    verified: 2026-09-29
    adopted: false
    covers: [part_vocabulary]
    notes: "No licence stated, which legally means no permission. Ask the authors or skip."

  # --- Added 2026-10-19 from a delegated dataset search. The two non-commercial licences
  # below (Argoverse 2, Oxford RobotCar) were verified at source by Claude the same day.
  # Every "custom" entry is recorded as the search reported it, NOT independently
  # verified: license_status unverified, so allowed_uses grants nothing until checked.

  argoverse2_sensor:
    name: "Argoverse 2 Sensor Dataset (1,000 logs, 30-class 3D cuboids, 7 ring + 2 stereo cams)"
    url: "https://argoverse.org/av2.html"
    license: CC-BY-NC-SA-4.0
    license_url: "https://www.argoverse.org/about.html"
    license_status: clear
    provenance: documented
    verified: 2026-10-19
    adopted: false
    covers: [rear_obstacles, thin_obstacles]
    notes: >-
      Verified at source 2026-10-19: data CC BY-NC-SA 4.0 ("non-commercial use only"),
      code MIT, attribution "(c) 2021 Argo AI, LLC". Own capture by Argo AI in 6 US cities.
      No car-part classes. Useful classes: BOLLARD, CONSTRUCTION_CONE, CONSTRUCTION_BARREL,
      SIGN, with amodal 3D cuboids plus lidar, so distances can be computed. Rear cameras
      ring_rear_left/right are roof-mounted at ~1.43 m, so not low-mounted. Objects are
      annotated only within 5 m of the drivable area. Splits 700/150/150. Faces and
      plates blurred (reported). ~1 TB. Evaluation only.

  oxford_robotcar:
    name: "Oxford RobotCar (~1,000 km, 6 cameras incl. rear fisheye, lidar, GPS/INS)"
    url: "https://robotcar-dataset.robots.ox.ac.uk/"
    license: CC-BY-NC-SA-4.0
    license_url: "https://robotcar-dataset.robots.ox.ac.uk/"
    license_status: clear
    provenance: documented
    verified: 2026-10-19
    adopted: false
    covers: [rear_obstacles]
    notes: >-
      Verified at source 2026-10-19: CC BY-NC-SA 4.0, "non-commercial academic use only",
      registration required. Own capture by the Oxford Robotics Institute on a fixed
      route. No object labels: depth would come from projected lidar. Rear mono fisheye,
      on-road rather than parking. Public streets; blurring not confirmed. Lead: the
      derived Oxford Road Boundaries (kerb masks), licence not checked. Evaluation only.

  pascal_part:
    name: "PASCAL-Part (PASCAL VOC 2010, 10,103 trainval images; car has 13 part types)"
    url: "https://cs.stanford.edu/~roozbeh/pascal-parts/pascal-parts.html"
    license: custom
    license_url: "https://cs.stanford.edu/~roozbeh/pascal-parts/pascal-parts.html"
    license_status: unverified
    provenance: documented
    verified: 2026-10-19
    adopted: false
    covers: [part_vocabulary, segmenter_pretraining]
    notes: >-
      As reported by the search, not independently verified. Annotations have no stated
      licence. Images are VOC 2010 from Flickr ("must respect the corresponding terms of
      use"). Car parts: left/right mirror, door (multi, no front/rear/side label), wheel,
      window, headlight, front/back plate, front/back/left/right/roof side. No bumper class
      (front/back side is the nearest proxy) and no liftgate. Best match for left/right
      mirrors, but the authors must be asked before training.

  paco_lvis:
    name: "PACO-LVIS (57,643 images, 75 object classes incl. car_(automobile), 200 part types)"
    url: "https://github.com/facebookresearch/paco"
    license: custom
    license_url: "https://github.com/facebookresearch/paco/blob/main/LICENSE"
    license_status: unverified
    provenance: documented
    verified: 2026-10-19
    adopted: false
    covers: [part_vocabulary, segmenter_pretraining]
    notes: >-
      As reported, not independently verified. The repo is MIT for "the Software"; no
      explicit data licence was found. Images are COCO 2017 (Flickr Terms of Use). The
      global part list includes bumper, door_handle, fender, headlight, hood, mirror,
      taillight, trunk, wheel, window, windshield, wiper. Which of these apply to cars is
      unconfirmed; no left/right or front/rear. Faces and plates visible.

  open_images_v7_car_subset:
    name: "Open Images V7 (944k train images with masks; Car, Wheel, Vehicle registration plate masks)"
    url: "https://storage.googleapis.com/openimages/web/index.html"
    license: custom
    license_url: "https://storage.googleapis.com/openimages/web/factsfigures_v7.html"
    license_status: unverified
    provenance: documented
    verified: 2026-10-19
    adopted: false
    covers: [segmenter_pretraining]
    notes: >-
      As reported, not independently verified. Annotations CC-BY-4.0. Images are "listed
      as" CC-BY-2.0, with a per-image check advised. CC-BY-2.0 is not in
      policy.permissive_licenses, a policy decision for the developer. Segmentation
      classes: Car, Wheel, Vehicle registration plate; box-only: Tire, Door, Window,
      Mirror, Door handle. Not part-of-car aware. No cone or bollard. Faces and plates
      visible.

  woodscape:
    name: "WoodScape (10k fisheye images, 4 cams incl. rear, 40+ instance classes)"
    url: "https://github.com/valeoai/WoodScape"
    license: custom
    license_url: "https://github.com/valeoai/WoodScape"
    license_status: unverified
    provenance: documented
    verified: 2026-10-19
    adopted: false
    covers: [rear_obstacles, thin_obstacles]
    notes: >-
      As reported, not independently verified. Code MIT; the data licence is stated only
      as "Proprietary" (a linked PDF the search could not read). Own capture by Valeo,
      with rear-camera (RV) images; semantic classes include curbs. 2D annotations only.
      Anonymised by a third party. Closest match to the rear/parking need: ask Valeo.

  fsoco:
    name: "FSOCO (11,572 images, 220,862 cones; boxes + instance segmentation)"
    url: "https://fsoco.github.io/fsoco-dataset/"
    license: custom
    license_url: "https://github.com/fsoco/fsoco-dataset"
    license_status: unverified
    provenance: documented
    verified: 2026-10-19
    adopted: false
    covers: [thin_obstacles]
    notes: >-
      As reported, not independently verified. No data licence stated; the GPL-3.0 badge
      is the tools repo, not clearly the data. Contributed by 41 Formula Student teams.
      Race-track cones (a domain gap from road cones). Roboflow re-uploads tagged
      CC-BY-4.0 likely conflict with this. Contact: fsoco.dataset@gmail.com.

  mvmc:
    name: "Multi-view Marketplace Cars (576 cars, ~10 views each, masks + rough poses)"
    url: "https://github.com/jasonyzhang/ners"
    license: custom
    license_url: "https://github.com/jasonyzhang/ners"
    license_status: unverified
    provenance: documented
    verified: 2026-10-19
    adopted: false
    covers: [multiview_vehicle]
    notes: >-
      As reported, not independently verified. Code BSD-3; the data zip has no stated
      licence. Images scraped from car-sale listings, so the sellers hold copyright.
      Rough poses. Treat as unusable unless the authors clarify.

  epfl_gims08:
    name: "EPFL Multi-View Car (GIMS08; 20 cars, 360 deg every ~3-4 deg)"
    url: "https://www.epfl.ch/labs/cvlab/data/data-pose-index-php/"
    license: custom
    license_url: "https://www.epfl.ch/labs/cvlab/data/data-pose-index-php/"
    license_status: unverified
    provenance: documented
    verified: 2026-10-19
    adopted: false
    covers: [multiview_vehicle]
    notes: >-
      As reported, not independently verified. Terms: "free to use them for research
      purposes"; copyright CVLab-EPFL. Tripod capture at the Geneva Motor Show 2008. No
      masks. 175 MB, no registration. "Research purposes" isn't on the policy lists, so
      no use until confirmed.

  freiburg_car_walkarounds:
    name: "Freiburg Stereo Ego-Motion dataset, car subset (52 walk-around car videos)"
    url: "https://lmb.informatik.uni-freiburg.de/resources/datasets/StereoEgomotion.en.html"
    license: custom
    license_url: "https://lmb.informatik.uni-freiburg.de/resources/datasets/StereoEgomotion.en.html"
    license_status: unverified
    provenance: documented
    verified: 2026-10-19
    adopted: false
    covers: [multiview_vehicle]
    notes: >-
      As reported, not independently verified. Terms: "provided for research purposes.
      Any commercial use is prohibited." Walk-around stereo videos of parked cars, close
      to the phone-scan protocol. No poses; COLMAP would be needed. Plates likely visible.
