# External (third-party) datasets: what each may be used for. ADR 0006.
#
# Developer's decision 2026-09-29: use existing licensed datasets first; fill the gaps
# with our own footage or by asking dataset owners for a licence.
#
# What a dataset may be used for is NOT set by hand. It is derived from
# `license_status` and `license` by the `policy` block below, in
# src/vscs/common/datasets.py, so a permissive-sounding entry cannot quietly grant
# publication rights. Code that touches external data calls `require_use(id, use)`.
#
# External data lives in data/external/<id>/ (gitignored, like all of data/). It never
# enters the dev/test lot splits (R-09) or the P4-T9 gold sets, which are ours.
schema_version: 1

# --- Uses ----------------------------------------------------------------------
#   rehearsal        run pipeline stages on it privately, to shake out bugs
#   private_eval     compute numbers on it for our own understanding
#   publish_results  report numbers on it (README, writeup), with a citation
#   train            train the student segmenter on it (the weights may be published)
#   publish_media    show its images/video/renders in docs/evidence, the README or the demo
policy:
  permissive_licenses: [CC-BY-4.0, CC0-1.0, Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause]
  noncommercial_licenses: [CC-BY-NC-4.0, CC-BY-NC-SA-4.0]
  uses_by_class:
    permissive: [rehearsal, private_eval, publish_results, train, publish_media]
    noncommercial: [rehearsal, private_eval, publish_results]
    conflicting: [rehearsal, private_eval]   # §9 third-party rule: private testing only
    unverified: []                           # verify before any use (§0: unclear licence)
    none: []                                 # no licence = no permission
  # A licence can only be granted by whoever owns the photos. When a dataset does not say
  # where its images came from (typical of user uploads), its images are never shown
  # publicly, whatever licence the uploader attached.
  undocumented_provenance_removes: [publish_media]

# --- Registry -------------------------------------------------------------------
# license_status: clear | conflicting | unverified | none
# provenance: documented | undocumented  (where the underlying images came from)
# adopted: whether we actually download it. A clear licence is not a reason to
# download data that does not cover a gap.
datasets:
  uco3d:
    name: "UnCommon Objects in 3D (Meta, CVPR 2025)"
    url: "https://github.com/facebookresearch/uco3d"
    license: CC-BY-4.0
    license_url: "https://github.com/facebookresearch/uco3d"
    license_status: clear
    verified: 2026-09-29
    adopted: false
    covers: [sfm_rehearsal_consumer_video]
    notes: >-
      Licence clean and consistent. Not adopted: crowd-sourced, mostly handheld/tabletop
      objects; no evidence of full-size vehicles; the personal_vehicles category is only
      reachable in blind ~16 GB video archives (289 GB total), and the category list sits
      in a 13 GB metadata database. Revisit if a vehicle subset is published.

  roboflow_car_parts_21:
    name: "Roboflow Universe 'car parts' (21 classes, 998 source images)"
    url: "https://universe.roboflow.com/car-segmentation-iq9jj/car-parts-9vig8"
    license: CC-BY-4.0
    license_url: "https://universe.roboflow.com/car-segmentation-iq9jj/car-parts-9vig8"
    license_status: clear
    provenance: undocumented
    verified: 2026-09-29
    adopted: true
    covers: [part_vocabulary, segmenter_cross_vehicle_test]
    source: {workspace: car-segmentation-iq9jj, project: car-parts-9vig8, version: 2}
    notes: >-
      Roboflow API reports "CC BY 4.0", public, 998 source images, instance segmentation,
      21 classes (Back-bumper .. Windshield). Mirror is ONE class (no left/right). Version 2
      holds 2,594 images: the train split is augmented copies (saturation, brightness),
      valid (100) and test (100) are not - evaluate on valid/test only. The uploader does
      not say where the photos came from, so images are never shown publicly.

  roboflow_car_parts_19:
    name: "Roboflow Universe 'Car Parts Segmentation' (19 classes, 603 source images)"
    url: "https://universe.roboflow.com/person-detector/car-parts-segmentation"
    license: CC-BY-4.0
    license_url: "https://universe.roboflow.com/person-detector/car-parts-segmentation"
    license_status: conflicting
    provenance: undocumented
    verified: 2026-09-29
    adopted: true
    covers: [part_vocabulary, segmenter_cross_vehicle_test]
    source: {workspace: person-detector, project: car-parts-segmentation, version: 2}
    notes: >-
      Roboflow API reports "CC BY 4.0", but the 19 classes are exactly the DSMLR
      Car-Parts-Segmentation classes plus "car", and DSMLR states no licence (see
      dsmlr_car_parts). An uploader cannot license photos they do not own, so the CC BY
      claim is treated as conflicting: private rehearsal/evaluation only. Useful because
      it keeps left/right mirrors and doors apart (CLAUDE.md §8.2 flip rule). Version 2's
      train split is heavily augmented (rotate, mosaic, noise, cutout); use valid (75)
      and test (78) for evaluation.

  threedrealcar:
    name: "3DRealCar (ICCV 2025): 2,500 smartphone 360-degree car scans"
    url: "https://github.com/LiAutoAD/3DRealCar"
    license: Apache-2.0
    license_url: "https://github.com/xiaobiaodu/3DRealCar_Toolkit"
    license_status: conflicting
    verified: 2026-09-29
    adopted: false
    covers: [vehicle_360_scan, metric_scale_reference, part_labels_2d, vans]
    notes: >-
      Repos carry an Apache-2.0 LICENSE and the toolkit README says the dataset is free
      for commercial use, but the download page says "Copyright Li Auto Inc. All Rights
      Reserved". The best-fitting dataset found; pending the developer's decision to ask
      the authors. Until resolved: private rehearsal/evaluation only.

  tanks_and_temples:
    name: "Tanks and Temples ('Truck' scene)"
    url: "https://www.tanksandtemples.org/download/"
    license: CC-BY-4.0
    license_url: "https://www.tanksandtemples.org/license/"
    license_status: conflicting
    verified: 2026-09-29
    adopted: false
    covers: [vehicle_360_scan]
    notes: >-
      Licence page states CC BY 4.0 and also a non-commercial research licence that
      forbids redistribution without permission.

  co3d:
    name: "Common Objects in 3D v2 (Meta)"
    url: "https://github.com/facebookresearch/co3d"
    license: CC-BY-NC-4.0
    license_url: "https://github.com/facebookresearch/co3d"
    license_status: clear
    verified: 2026-09-29
    adopted: false
    covers: [sfm_rehearsal_consumer_video]
    notes: "Non-commercial. Superseded for our purposes by uCO3D, which has the same gap."

  mvimgnet:
    name: "MVImgNet / MVImgNet2.0"
    url: "https://github.com/GAP-LAB-CUHK-SZ/MVImgNet"
    license: CC-BY-NC-4.0
    license_url: "https://github.com/GAP-LAB-CUHK-SZ/MVImgNet"
    license_status: clear
    verified: 2026-09-29
    adopted: false
    covers: [sfm_rehearsal_consumer_video]
    notes: "Non-commercial, plus its own terms of use. Handheld objects."

  dsmlr_car_parts:
    name: "DSMLR Car-Parts-Segmentation (500 images, 18 classes)"
    url: "https://github.com/dsmlr/Car-Parts-Segmentation"
    license: null
    license_url: null
    license_status: none
    verified: 2026-09-29
    adopted: false
    covers: [part_vocabulary]
    notes: "No licence stated, which legally means no permission. Ask the authors or skip."

  # --- Streaming direction (ADR 0008) ---------------------------------------------

  nuscenes:
    name: "nuScenes (Motional): calibrated cameras, 3D boxes, ego poses"
    url: "https://www.nuscenes.org/nuscenes"
    license: CC-BY-NC-SA-4.0
    license_url: "https://www.nuscenes.org/terms-of-use"
    license_status: clear
    verified: 2026-09-30
    adopted: true
    covers: [calibrated_driving_video, ground_truth_3d_tracks, streaming_replay_source]
    source: {subset: "v1.0-mini"}
    notes: >-
      CC BY-NC-SA 4.0: non-commercial use only (personal, educational, some research);
      commercial licences via Motional. Download needs the developer's account and
      acceptance of the terms (the developer does this; not automated). Start with
      v1.0-mini (P4-T14). Showing its frames in a demo is currently blocked by this
      registry's non-commercial policy class; loosening that is the developer's call.

  dota:
    name: "DoTA - Detection of Traffic Anomaly (dashcam accident clips)"
    url: "https://github.com/MoonBlvd/Detection-of-Traffic-Anomaly"
    license: null
    license_url: null
    license_status: unverified
    verified: null
    adopted: false
    covers: [crash_near_miss_eval]
    notes: >-
      Compiled from public online dashcam videos. Check the terms before any use; even if
      the annotations are licensed, treat the video as having no republication rights
      (CLAUDE.md §9). Private evaluation only (P4-T15).

  ccd:
    name: "CCD - Car Crash Dataset"
    url: "https://github.com/Cogito2012/CarCrashDataset"
    license: null
    license_url: null
    license_status: unverified
    verified: null
    adopted: false
    covers: [crash_near_miss_eval]
    notes: "As dota: verify terms first; video has no republication rights; private only."

  dad:
    name: "DAD - Dashcam Accident Dataset"
    url: "https://aliensunmin.github.io/project/dashcam/"
    license: null
    license_url: null
    license_status: unverified
    verified: null
    adopted: false
    covers: [crash_near_miss_eval]
    notes: "As dota: verify terms first; video has no republication rights; private only."
