# Tests and lint on every push and pull request (ADR 0016).
# Informational: main does not require this check, so direct pushes stay possible.
# Windows, to match the development laptop (ADR 0001, ADR 0003).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: envs/requirements-core.txt

      - name: Install (pinned)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r envs/requirements-core.txt
          python -m pip install -e . --no-deps

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest -q --tb=short
